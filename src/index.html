<!-- FIX 2 -> Add gap between voice and searchbar -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./output.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="icon" href="https://www.youtube.com/s/desktop/aaaab8bf/img/favicon_144x144.png" type="image/png">
</head>
<body class="font-sans h-screen max-h-screen flex flex-col overflow-hidden">
    <header class="flex items-center h-16 px-5 justify-between">
        <div class="flex h-full items-center gap-5">
            <a href="#"><i class="ri-menu-line text-xl"></i></a>
            <img class="md:h-2/5 h-2/7 cursor-pointer" src="./assets/img/logo.png" alt="">  
        </div>
        <div class="flex h-full items-center md:w-1/2 sm:w-1/3">
            <input type="text" placeholder="Search" class="sm:inline hidden border focus:border-blue-400 w-full border-gray-300 text-gray-700 h-3/5 px-4 pb-1 text-base rounded-l-full outline-0">
            <a href="#" class="border-gray-300  focus:border-gray-400 border px-3 h-3/5 rounded-r-full"><i class="ri-search-line text-2xl"></i></a>
            <a href="#" class="h-3/5 aspect-square focus:border-gray-400 focus:border hover:bg-gray-300 flex items-center justify-center  rounded-full"><i class="ri-mic-line text-2xl"></i></a>
        </div>
        <div class="flex h-full items-center gap-3">
            <button class="flex items-center gap-1 h-3/5 p-2.5 rounded-full cursor-pointer border border-transparent focus:border-gray-400">
                <i class="ri-add-line text-2xl"></i>
                <span class=" font-medium text-sm">Create</span>
            </button>
            <a href="#" class="cursor-pointer rounded-full focus:border focus:border-gray-400 aspect-square h-3/5 flex items-center justify-center">
                <i class="ri-notification-3-line text-2xl"></i>
            </a>
            <div class="cursor-pointer bg-blue-600 h-3/5 focus:border-blue-400 focus:border aspect-square flex items-center justify-center rounded-full">
                <p class="font-medium text-white text-lg select-none">P</p>
            </div>
        </div>
    </header>
    <div class="flex h-full min-h-0 gap-6">
        <nav class="w-64 shrink-0 overflow-y-auto bg-white sidebar"></nav>
        <div class="content flex-1 min-w-0 overflow-y-scroll pr-2">
            <div class="tags flex gap-4 overflow-x-auto w-full no-scrollbar my-4"></div>
            <div class="feed grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-6">
            </div>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
