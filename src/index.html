<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./output.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body class="font-sans">
    <header class="flex items-center h-16  px-5 justify-between">
        <div class="flex h-full items-center gap-5">
            <a href="#"><i class="ri-menu-line text-xl"></i></a>
            <img class="h-2/5 cursor-pointer" src="./assets/img/logo.png" alt="">  
        </div>
        <div class="flex h-full items-center w-1/2">
            <input type="text" placeholder="Search" class="border focus:border-blue-400 w-full border-gray-300 text-gray-700 h-3/5 px-4 pb-1 text-base rounded-l-full outline-0">
            <a href="#" class="border-gray-300  focus:border-gray-400 border px-3 h-3/5 rounded-r-full"><i class="ri-search-line text-2xl"></i></a>
            <a href="#" class="h-3/5 aspect-square focus:border-gray-400 focus:border hover:bg-gray-300 flex items-center justify-center  rounded-full"><i class="ri-mic-line text-2xl"></i></a>
        </div>
        <div class="flex h-full items-center gap-3">
            <button class="flex items-center gap-1 h-3/5 p-2.5 rounded-full cursor-pointer border border-transparent focus:border-gray-400">
                <i class="ri-add-line text-2xl"></i>
                <span class=" font-medium text-sm">Create</span>
            </button>
            <a href="#" class="cursor-pointer rounded-full focus:border focus:border-gray-400 aspect-square h-3/5 flex items-center justify-center">
                <i class="ri-notification-3-line text-2xl"></i>
            </a>
            <div class="cursor-pointer bg-blue-600 h-3/5 focus:border-blue-400 focus:border aspect-square flex items-center justify-center rounded-full">
                <p class="font-medium text-white text-lg select-none">P</p>
            </div>
        </div>
    </header>
</body>
</html>
